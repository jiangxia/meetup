<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI酒馆 - 配置设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-amber-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-cocktail text-2xl"></i>
                <h1 class="text-2xl font-bold">AI酒馆 - 系统配置</h1>
            </div>
            <a href="index.html" class="bg-amber-700 hover:bg-amber-600 px-4 py-2 rounded-lg transition">
                <i class="fas fa-home mr-2"></i>返回主页
            </a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 配置状态卡片 -->
        <div id="statusCard" class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-server mr-2"></i>服务状态
                    </h2>
                    <div id="statusIndicator" class="flex items-center">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-amber-600 mr-2"></div>
                        <span class="text-gray-600">检查服务状态中...</span>
                    </div>
                </div>
                <button onclick="checkServiceStatus()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-sync-alt mr-2"></i>刷新状态
                </button>
            </div>
        </div>

        <!-- 配置表单 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- OpenAI 配置 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center mb-6">
                    <i class="fas fa-robot text-2xl text-green-600 mr-3"></i>
                    <h3 class="text-xl font-bold text-gray-800">OpenAI API 配置</h3>
                </div>
                
                <form id="openaiForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            API Key <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="openaiApiKey" 
                                   placeholder="sk-你的OpenAI API密钥" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent pr-12">
                            <button type="button" onclick="togglePasswordVisibility('openaiApiKey')" 
                                    class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">
                            <i class="fas fa-info-circle mr-1"></i>
                            <a href="https://platform.openai.com/api-keys" target="_blank" class="text-blue-600 hover:underline">
                                点击获取 OpenAI API Key
                            </a>
                        </p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">模型选择</label>
                        <select id="openaiModel" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                            <option value="gpt-4o-mini">GPT-4o Mini (推荐)</option>
                            <option value="gpt-4o">GPT-4o</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-medium transition">
                        <i class="fas fa-check mr-2"></i>保存 OpenAI 配置
                    </button>
                </form>
            </div>

            <!-- MCP 配置 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center mb-6">
                    <i class="fas fa-link text-2xl text-blue-600 mr-3"></i>
                    <h3 class="text-xl font-bold text-gray-800">MCP 连接配置</h3>
                </div>

                <form id="mcpForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">传输方式</label>
                        <select id="mcpTransport" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="stdio">Stdio (推荐)</option>
                            <option value="http">HTTP</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">服务器命令</label>
                        <input type="text" id="mcpCommand" value="promptx mcp" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <p class="text-sm text-gray-500 mt-1">
                            <i class="fas fa-info-circle mr-1"></i>确保已安装 PromptX CLI
                        </p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">连接超时 (毫秒)</label>
                        <input type="number" id="mcpTimeout" value="10000" min="1000" max="60000"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition">
                        <i class="fas fa-check mr-2"></i>保存 MCP 配置
                    </button>
                </form>
            </div>
        </div>

        <!-- 高级配置 -->
        <div class="bg-white rounded-xl shadow-lg p-6 mt-8">
            <div class="flex items-center mb-6">
                <i class="fas fa-cogs text-2xl text-purple-600 mr-3"></i>
                <h3 class="text-xl font-bold text-gray-800">高级配置</h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">服务端口</label>
                    <input type="number" id="serverPort" value="3001" min="1000" max="65535"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">默认会话ID</label>
                    <input type="text" id="defaultSession" value="default"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">最大记忆数</label>
                    <input type="number" id="maxMemories" value="100" min="10" max="1000"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="debugMode" class="h-4 w-4 text-purple-600 rounded mr-3">
                    <label for="debugMode" class="text-sm font-medium text-gray-700">启用调试模式</label>
                </div>
            </div>

            <div class="flex justify-between mt-6">
                <button onclick="resetToDefaults()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-undo mr-2"></i>重置默认值
                </button>
                <button onclick="saveAdvancedConfig()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-check mr-2"></i>保存高级配置
                </button>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="bg-white rounded-xl shadow-lg p-6 mt-8">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-tools mr-2"></i>系统操作
                </h3>
            </div>

            <div class="flex flex-wrap gap-4">
                <button onclick="testConfiguration()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-flask mr-2"></i>测试配置
                </button>
                <button onclick="downloadConfig()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-download mr-2"></i>下载配置文件
                </button>
                <button onclick="restartServices()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-refresh mr-2"></i>重启服务
                </button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="notification" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="notificationText">配置保存成功！</span>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
</body>
</html>
